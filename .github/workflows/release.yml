name: Desktop previews

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: Build Windows/Linux candidates only (no publishing or macOS signing)
        type: boolean
        default: false
      promote_version:
        description: Promote a validated version (e.g. 0.0.0-preview.22.1) to the macOS preview updater feed; no build
        type: string
        default: ""
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ inputs.candidates && github.ref || 'macos-prerelease' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'block/buzz-app' && !inputs.candidates && !inputs.promote_version
    name: Build, sign, and notarize
    runs-on: macos-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
    steps:
      - name: Require main and signing configuration
        env:
          SOURCE_REF: ${{ github.ref }}
          SIGNING_ROLE: ${{ secrets.OSX_CODESIGN_ROLE }}
          SIGNING_BUCKET: ${{ secrets.CODESIGN_S3_BUCKET }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test "$SOURCE_REF" = refs/heads/main || { echo '::error::Releases must run from main'; exit 1; }
          test -n "$SIGNING_ROLE" && test -n "$SIGNING_BUCKET" || { echo '::error::Set OSX_CODESIGN_ROLE and CODESIGN_S3_BUCKET'; exit 1; }
          test -n "$UPDATER_KEY" && test -n "$UPDATER_PASSWORD" || { echo '::error::Set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD'; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-prerelease
          cache-all-crates: true

      - name: Set preview version
        id: version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const base = config.version.split('-')[0];
          if (!/^\d+\.\d+\.\d+$/.test(base)) throw new Error('Expected a numeric Tauri version');
          const version = `${base}-preview.${process.env.GITHUB_RUN_NUMBER}.${process.env.GITHUB_RUN_ATTEMPT}`;
          writeFileSync(`${process.env.RUNNER_TEMP}/release.json`, JSON.stringify({ version, bundle: { createUpdaterArtifacts: false } }));
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS

      - name: Build unsigned app and DMG
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          rm -rf target/release/bundle
          pnpm tauri build --ci --no-sign --bundles dmg --config "$RUNNER_TEMP/release.json" -- --locked

      - name: Locate unsigned DMG
        id: unsigned
        run: |
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1 || { echo '::error::Expected exactly one DMG'; exit 1; }
          echo "path=${dmgs[0]}" >> "$GITHUB_OUTPUT"

      - name: Sign and notarize
        id: codesign
        uses: block/apple-codesign-action@679535d1ab7c5a7c18e6f9afcba3464512cc3dde # v1.1.0
        with:
          osx-codesign-role: ${{ secrets.OSX_CODESIGN_ROLE }}
          codesign-s3-bucket: ${{ secrets.CODESIGN_S3_BUCKET }}
          unsigned-artifact-path: ${{ steps.unsigned.outputs.path }}
          artifact-name: buzz-app-${{ github.run_id }}-${{ github.run_attempt }}-arm64

      - name: Verify release DMG and bundled runtime
        env:
          SIGNED_DMG: ${{ steps.codesign.outputs.signed-dmg-path }}
        run: |
          app_dir=$(mktemp -d "$RUNNER_TEMP/verify-release.XXXXXX")
          hdiutil attach "$SIGNED_DMG" -readonly -nobrowse -mountpoint "$app_dir" >/dev/null
          trap 'hdiutil detach "$app_dir" >/dev/null' EXIT
          app="$app_dir/Buzz Foundation.app"
          codesign --verify --deep --strict --verbose=2 \
            -R '=anchor apple generic and certificate 1[field.1.2.840.113635.100.6.2.6] exists and certificate leaf[field.1.2.840.113635.100.6.1.13] exists and certificate leaf[subject.OU] = EYF346PHUG' "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          node --input-type=module - "$app/Contents/Resources/agent-runtime" <<'JS'
          import { readFileSync, lstatSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const directory = process.argv[2];
          const source = JSON.parse(readFileSync('runtime/agent-runtime.json', 'utf8'));
          const manifest = JSON.parse(readFileSync(`${directory}/manifest.json`, 'utf8'));
          assert.equal(manifest.version, 1);
          assert.equal(manifest.revision, source.revision);
          assert.equal(manifest.target, 'aarch64-apple-darwin');
          assert.deepEqual(Object.keys(manifest.files).sort(), [...source.tools].sort());
          for (const name of source.tools) {
            const path = `${directory}/${name}`;
            assert.ok(lstatSync(path).isFile(), `${name} must be a regular file`);
            assert.ok(lstatSync(path).mode & 0o111, `${name} must be executable`);
          }
          JS

      - name: Stage release assets and checksums
        env:
          SIGNED_DMG: ${{ steps.codesign.outputs.signed-dmg-path }}
          VERSION: ${{ steps.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir release-assets
          cp "$SIGNED_DMG" "release-assets/Buzz_${VERSION}_aarch64.dmg"

          # Package the verified, Apple-signed and stapled app from the release DMG.
          app_dir=$(mktemp -d "$RUNNER_TEMP/updater-app.XXXXXX")
          hdiutil attach "$SIGNED_DMG" -readonly -nobrowse -mountpoint "$app_dir" >/dev/null
          trap 'hdiutil detach "$app_dir" >/dev/null' EXIT
          app="$app_dir/Buzz Foundation.app"
          test -d "$app" || { echo '::error::Signed DMG contains no app'; exit 1; }
          archive="$PWD/release-assets/Buzz_${VERSION}_aarch64.app.tar.gz"
          # ditto copies the complete signed bundle (including symlinks and metadata).
          staged_app=$(mktemp -d "$RUNNER_TEMP/updater-staging.XXXXXX")
          ditto "$app" "$staged_app/Buzz Foundation.app"
          codesign --verify --deep --strict "$staged_app/Buzz Foundation.app"
          (cd "$staged_app" && COPYFILE_DISABLE=1 tar -czf "$archive" 'Buzz Foundation.app')
          pnpm tauri signer sign "$archive"
          test -s "$archive" && test -s "$archive.sig" || { echo '::error::Updater signing failed'; exit 1; }
          (cd release-assets && shasum -a 256 ./*.dmg ./*.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-macos-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-macos-release
          path: release-assets
      - name: Publish signed DMG
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" release-assets/* \
            --target "$SOURCE_SHA" --prerelease --latest=false \
            --title "Buzz $VERSION (macOS preview)" \
            --notes "Apple Silicon macOS preview from commit $SOURCE_SHA. Built, signed, and notarized by Actions run $GITHUB_RUN_ID."

  promote_preview:
    name: Promote verified macOS preview
    needs: [build, publish]
    # Explicit promotions skip build/publish; automatic promotions require both to succeed.
    if: >-
      ${{ !cancelled() && github.repository == 'block/buzz-app' && github.ref == 'refs/heads/main' && !inputs.candidates &&
          ((inputs.promote_version != '' && needs.build.result == 'skipped' && needs.publish.result == 'skipped') ||
           (inputs.promote_version == '' && needs.build.result == 'success' && needs.publish.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and publish preview feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.promote_version || needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Validate the version before using it in release asset paths.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+\.[0-9]+$ ]] || exit 1
          export archive="Buzz_${VERSION}_aarch64.app.tar.gz"
          mkdir -p "$RUNNER_TEMP/candidate" "$RUNNER_TEMP/current" "$RUNNER_TEMP/served"
          gh release view "v$VERSION" --json assets,isPrerelease --jq \
            '.isPrerelease and (any(.assets[]; .name == env.archive and .size > 0)) and (any(.assets[]; .name == (env.archive + ".sig") and .size > 0))' | grep -qx true
          gh release download "v$VERSION" --pattern "$archive" --dir "$RUNNER_TEMP/candidate"
          gh release download "v$VERSION" --pattern "$archive.sig" --dir "$RUNNER_TEMP/candidate"
          test -s "$RUNNER_TEMP/candidate/$archive" && test -s "$RUNNER_TEMP/candidate/$archive.sig"
          tar -xOzf "$RUNNER_TEMP/candidate/$archive" 'Buzz Foundation.app/Contents/MacOS/buzz-foundation' > "$RUNNER_TEMP/candidate/buzz-foundation"
          test -s "$RUNNER_TEMP/candidate/buzz-foundation"
          current=''
          if gh release view preview-feed >/dev/null 2>&1; then
            gh release download preview-feed --pattern latest.json --dir "$RUNNER_TEMP/current"
            current="$RUNNER_TEMP/current/latest.json"
          fi
          node scripts/preview-feed.mjs generate "$VERSION" "$RUNNER_TEMP/candidate/$archive.sig" "$RUNNER_TEMP/candidate/latest.json" "$RUNNER_TEMP/candidate/$archive" "$RUNNER_TEMP/candidate/buzz-foundation" ${current:+"$current"}
          node scripts/preview-feed.mjs verify "$VERSION" "$RUNNER_TEMP/candidate/$archive.sig" "$RUNNER_TEMP/candidate/latest.json" "$RUNNER_TEMP/candidate/$archive" "$RUNNER_TEMP/candidate/buzz-foundation" ${current:+"$current"}
          if [[ -z "$current" ]]; then
            gh release create preview-feed "$RUNNER_TEMP/candidate/latest.json" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title 'Buzz macOS preview updater feed' \
              --notes 'Rolling manifest for manually validated macOS previews. Not the stable channel.'
          elif cmp -s "$RUNNER_TEMP/candidate/latest.json" "$current"; then
            echo 'Preview feed already points to this candidate.'
          else
            gh release upload preview-feed "$RUNNER_TEMP/candidate/latest.json" --clobber
          fi
          gh release download preview-feed --pattern latest.json --dir "$RUNNER_TEMP/served"
          cmp "$RUNNER_TEMP/candidate/latest.json" "$RUNNER_TEMP/served/latest.json"

  windows:
    if: github.repository == 'block/buzz-app' && inputs.candidates
    name: Windows x64 candidate (unsigned)
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reuse the native CI pin selection; Hermit does not run on Windows.
      - name: Read repository tool pins
        id: pins
        shell: pwsh
        run: |
          foreach ($tool in @('rust', 'node', 'pnpm')) {
            $pins = @(Get-ChildItem "bin/.$tool-*.pkg")
            if ($pins.Count -ne 1) { throw "Expected one $tool pin" }
            $version = $pins[0].Name -replace "^\.$tool-(.*)\.pkg$", '$1'
            "$tool=$version" >> $env:GITHUB_OUTPUT
          }
      - name: Select pinned Rust
        shell: pwsh
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust }}
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$env:RUST_VERSION" >> $env:GITHUB_ENV
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ steps.pins.outputs.pnpm }}
      - run: pnpm install --frozen-lockfile
      - name: Set candidate version
        run: node scripts/candidate-version.mjs
      - name: Build NSIS installer
        run: pnpm tauri build --ci --no-sign --bundles nsis --config "$RUNNER_TEMP/candidate.json" -- --locked
      - name: Install into disposable runner and verify resource payload
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          $destination = "$env:RUNNER_TEMP\candidate-install"
          # NSIS /D must be last and unquoted, including paths containing spaces.
          $process = Start-Process $installers[0].FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (!(Test-Path "$destination\buzz-foundation.exe")) { throw 'App executable missing' }
          node scripts/verify-runtime-bundle.mjs "$destination\agent-runtime" x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage candidate and checksum
        run: |
          mkdir release-assets
          installers=(target/release/bundle/nsis/*.exe)
          test "${#installers[@]}" -eq 1
          cp "${installers[0]}" "release-assets/Buzz_${VERSION}_x64_unsigned.exe"
          printf '%s\n' "$GITHUB_SHA" > release-assets/SOURCE_COMMIT
          cd release-assets
          sha256sum ./*.exe > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-candidate
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  linux:
    if: github.repository == 'block/buzz-app' && inputs.candidates
    name: Linux x64 candidates
    runs-on: ubuntu-latest
    # Shipped old-Buzz recipe, without its mesh/Kubernetes/updater dependencies.
    container: ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Install build and packaging dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl desktop-file-utils file git \
            libasound2-dev libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev patchelf pkg-config \
            squashfs-tools wget xdg-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # No shared writable release caches. Use existing pins and frozen inputs.
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - run: pnpm install --frozen-lockfile
      - name: Install pinned AppImage repacking tools
        run: |
          wget -q -O /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool' | sha256sum -c
          install -m 755 /tmp/appimagetool /usr/local/bin/appimagetool
          wget -q -O /tmp/appimage-runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          echo '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  /tmp/appimage-runtime' | sha256sum -c
          install -D -m 644 /tmp/appimage-runtime /usr/local/lib/appimage-runtime
          echo 'APPIMAGETOOL_RUNTIME_FILE=/usr/local/lib/appimage-runtime' >> "$GITHUB_ENV"
      - name: Set candidate version
        run: node scripts/candidate-version.mjs
      - name: Build deb and AppImage
        run: pnpm tauri build --ci --no-sign --bundles deb,appimage --config "$RUNNER_TEMP/candidate.json" -- --locked
      - name: Repair AppImage and verify both packaged resource payloads
        run: |
          shopt -s nullglob
          debs=(target/release/bundle/deb/*.deb)
          images=(target/release/bundle/appimage/*.AppImage)
          test "${#debs[@]}" -eq 1 && test "${#images[@]}" -eq 1
          bash scripts/fix-appimage.sh "${images[0]}"
          dpkg-deb -x "${debs[0]}" "$RUNNER_TEMP/deb"
          node scripts/verify-runtime-bundle.mjs "$RUNNER_TEMP/deb/usr/lib/Buzz Foundation/agent-runtime" x86_64-unknown-linux-gnu
          image=$(realpath "${images[0]}")
          mkdir "$RUNNER_TEMP/appimage"
          (cd "$RUNNER_TEMP/appimage" && "$image" --appimage-extract >/dev/null)
          node scripts/verify-runtime-bundle.mjs "$RUNNER_TEMP/appimage/squashfs-root/usr/lib/Buzz Foundation/agent-runtime" x86_64-unknown-linux-gnu
          mkdir release-assets
          cp "${debs[0]}" "release-assets/Buzz_${VERSION}_amd64.deb"
          cp "${images[0]}" "release-assets/Buzz_${VERSION}_x86_64.AppImage"
          printf '%s\n' "$GITHUB_SHA" > release-assets/SOURCE_COMMIT
          cd release-assets
          sha256sum ./*.deb ./*.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x64-candidates
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
